[project]
name = "knowdoc-ai"
version = "0.1.0"
description = "Local-first, version-aware knowledge intelligence with verifiable evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pgvector>=0.4,<1", "python-multipart>=0.0.20", "httpx>=0.28,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "beautifulsoup4>=4.13,<5",
  "markdown-it-py>=3,<5", "argon2-cffi>=23,<26", "numpy>=2,<3",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3,<6"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "reportlab>=4,<5",
    "matplotlib>=3.10,<4",
]

[project.scripts]
knowdoc-worker = "knowdoc.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
